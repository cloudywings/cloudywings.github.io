<script type="application/json" id="state">{"entries":[{"id":"e1792968125480","date":"2026-10-20","mood":"😌 Tenang","title":"the day we broke up","text":"Hari pertama aku memutuskan untuk menyudahi hubungan yang telah berlangsung lama ini dengan berat hati, mungkin kamu sekarang udah benci segalanya tentang aku, but i'll never hate you. Berat hati aku memilih jalan ini, tapi aku tau kamu ga akan bisa berkembang kalau ada aku di sela hidupmu, aku bagaikan lingkaran setan yang terus mengekangmu untuk bebas melakukan banyak hal.\n\ndi hari pertama ini aku masih fine fine aja ga ada rasa kepikiran apapun buat ngelepas kamu dari hidupku, it feels like \"ah gamungkin bakal kepikiran\".","updated":1792968919855},{"id":"e1792968202431","date":"2026-10-21","mood":"😌 Tenang","title":"day 1","text":"aku masih ngejalanin hariku dengan baik, tapi kamu masih lewat sepintas di dalam pikiranku tapi aku ngerasa itu cuma angin lewat aja, aku tetep lanjut jalanin semua aktivitas ku. Aku masih berpikiran ngelepas kamu adalah salah satu jalan dimana kamu bisa berkembang bebas tanpa terkekang dalam hubungan ini.","updated":1792968945512},{"id":"e1792968358072","date":"2026-10-22","mood":"😐 Biasa saja","title":"day 2","text":"Semua berasa flat dan aneh, aku ngerasa ada yang janggal di perasaanku, di dalam hatiku, tapi nggak tau apa tapi aku tetep ngejalanin hari kaya biasanya dan ga ngehirauin itu semua, cuma ngerasa ada yang janggal aja. I still think the same like yesterday","updated":1792968949640},{"id":"e1792968470817","date":"2026-10-23","mood":"😐 Biasa saja","title":"day 3","text":"Still same, it just flat and weird. semua masih berjalan dengan gitu aja, ga ada hal menarik yang terjadi, dan yes pikiran itu masih sepintas lewat di dalam pikiranku, tapi tetep aja aku hirauin, dan aku masih berpikiran yang sama kalau aku cuma ganggu di hidupmu, i know you said kita bakal cocok di masa depan kalau masih bersama, but it was the best for you zah.","updated":1792968953264},{"id":"e1792968896966","date":"2026-10-24","mood":"😟 Cemas","title":"day 4","text":"it feels strange, aku ngerasa di hatiku ada yang ngeganjel banget, aku mulai sadar keputusan yang aku ambil sebenernya terlalu tergesa gesa, tapi aku tau itu untuk kebaikanmu sendiri zah. Aku tau kamu pasti bakal menjalani harimu 1-3 minggu ke depan tanpa aku dengan baik, dan mungkin ga bakal mikirin aku?","updated":1792968957108},{"id":"e1792969068953","date":"2026-10-25","mood":"😢 Sedih","title":"day 5","text":"Semua terasa berat banget, aku ngerasa hatiku ngerasa bersalah karena ngebiarin kamu lepas dari aku. Still same, it was the best for you zah, tapi hatiku merasa ga terima buat ngelepas kamu, i know we cant go back together because you already decided it was the last we are together.","updated":1792970487306},{"id":"e1793030333156","date":"2026-10-26","mood":"😢 Sedih","title":"day 6","text":"its feel heavy, jalanin hari rasanya beratttttt banget... ga ada yang ngabarin, ngga ada yang ngingetin kebutuhan harianku... ga ada yang ngesupport aku, tapi hari ini aku tau. Kamu lebih baik tanpa aku zah, i know kamu mungkin udah mulai ga mikirin aku. Keep your spirit ya! aku tetep support kamu dari jauh ko, kamu keren!","updated":1793030333156}]}</script>

  (function(){var st=document.createElement("style");st.textContent="@font-face{font-family:HelvDisp;font-weight:bold;font-display:swap;src:url(data:font/ttf;base64,"+HFONT+") format(\"truetype\")}";document.head.appendChild(st);})();
  var $=function(i){return document.getElementById(i)};
  var months=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var KEY="diary:v1",MSG="diary:msg";
  var S={entries:[]};
  try{var p0=JSON.parse($("state").textContent);if(p0&&Array.isArray(p0.entries))S=p0;}catch(e){}
  var curId=null,delArmed=false,canWrite=false,art=null,busy=false;

  $("app").innerHTML=`<main>
  <h1>Dear, izzah</h1>
  <p class="sub" id="sub">Semoga kamu terus berkembang ya!</p>
  <section class="card" id="editor" hidden aria-label="Editor">
    <div class="row">
      <input type="date" id="date" aria-label="Tanggal">
      <select id="mood" aria-label="Suasana hati">
        <option value="">Suasana hati</option>
        <option>😊 Senang</option><option>😌 Tenang</option><option>🥰 Bersyukur</option>
        <option>😐 Biasa saja</option><option>😴 Lelah</option><option>😟 Cemas</option><option>😢 Sedih</option><option>😠 Kesal</option>
      </select>
      <input class="title" id="title" placeholder="Judul (boleh dikosongkan)" aria-label="Judul">
    </div>
    <textarea id="text" placeholder="Hari ini aku…" aria-label="Isi diary"></textarea>
    <div class="bar">
      <span class="mut" id="count">0 kata</span>
      <div class="btns">
        <button id="new">Tulisan baru</button>
        <button class="d" id="del" hidden>Hapus</button>
        <button class="p" id="save">Simpan</button>
      </div>
    </div>
    <div class="mut" id="msg" role="status" style="margin-top:8px;min-height:1.2em"></div>
  </section>
  <section class="card" id="legacy" hidden>
    <div class="bar" style="margin-top:0">
      <span id="legacytxt"></span>
      <button class="p" id="legacybtn">Pindahkan</button>
    </div>
  </section>
  <section class="card list" aria-label="Daftar tulisan">
    <h2>Tulisan</h2>
    <input class="search" id="q" type="search" placeholder="Cari judul atau isi…" aria-label="Cari">
    <div id="list"></div>
  </section>
</main>`;

  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function fmt(s){var p=(s||"").split("-");if(p.length!==3)return s||"";return parseInt(p[2],10)+" "+months[parseInt(p[1],10)-1]+" "+p[0];}
  function say(t){var m=$("msg");if(m)m.textContent=t;}
  function words(){var t=$("text").value.trim();return t?t.split(/\s+/).length:0;}
  function sorted(){return S.entries.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.updated||0)-(a.updated||0);});}

  function render(){
    var q=$("q").value.trim().toLowerCase(),box=$("list");
    box.textContent="";
    var arr=sorted().filter(function(e){return !q||((e.title||"")+" "+e.text).toLowerCase().indexOf(q)>-1;});
    if(!arr.length){
      var d=document.createElement("div");d.className="empty";
      d.textContent=S.entries.length?"Tidak ada yang cocok.":(canWrite?"Belum ada tulisan. Mulai dari yang pertama ✍️":"Belum ada tulisan.");
      box.appendChild(d);return;
    }
    arr.forEach(function(e){
      var it=document.createElement("article");it.className="item"+(e.id===curId?" on":"");
      var top=document.createElement("div");top.className="top";
      var b=document.createElement("b");b.textContent=e.title||"Tanpa judul";
      top.appendChild(b);
      if(canWrite){var eb=document.createElement("button");eb.textContent="Edit";eb.onclick=function(){openE(e.id)};top.appendChild(eb);}
      var m=document.createElement("div");m.className="mut";m.textContent=fmt(e.date)+(e.mood?" · "+e.mood:"");
      var p=document.createElement("p");p.textContent=e.text;
      it.appendChild(top);it.appendChild(m);it.appendChild(p);box.appendChild(it);
    });
  }

  function fresh(){
    curId=null;delArmed=false;
    $("date").value=today();$("mood").value="";$("title").value="";$("text").value="";
    $("del").hidden=true;$("del").textContent="Hapus";
    $("count").textContent="0 kata";say("");render();
  }
  function openE(id){
    var e=S.entries.filter(function(x){return x.id===id})[0];if(!e)return;
    curId=id;delArmed=false;
    $("date").value=e.date;$("mood").value=e.mood||"";$("title").value=e.title||"";$("text").value=e.text||"";
    $("del").hidden=false;$("del").textContent="Hapus";
    $("count").textContent=words()+" kata";say("Sedang mengedit tulisan ini.");render();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function buildDoc(st){
    var json=JSON.stringify(st).replace(/</g,"\\u003c");
    var title=document.title.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return "<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>"+title+"</title>\n<style id=\"app-css\">"+$("app-css").textContent+"</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<script type=\"application/json\" id=\"state\">"+json+"<\/script>\n<script id=\"app-js\">"+$("app-js").textContent+"<\/script>\n</body>\n</html>";
  }
  async function commit(list,okMsg){
    if(!art||busy)return;
    busy=true;say("Menyimpan…");
    try{sessionStorage.setItem(MSG,okMsg);}catch(e){}
    try{await art.publish(buildDoc({entries:list}));}
    catch(e){
      busy=false;
      try{sessionStorage.removeItem(MSG);}catch(x){}
      var c=e&&e.code;
      say(c==="not_writer"||c==="not_granted"?"Kamu tidak punya izin untuk menyimpan di halaman ini.":c==="conflict"?"Halaman baru saja diperbarui dari tempat lain. Muat ulang lalu coba lagi.":"Gagal menyimpan. Coba lagi sebentar lagi.");
    }
  }
  function save(){
    if(!canWrite||busy)return;
    if(!$("text").value.trim()){say("Tulis sesuatu dulu ya.");return;}
    var data={date:$("date").value||today(),mood:$("mood").value,title:$("title").value.trim(),text:$("text").value,updated:Date.now()};
    var list;
    if(curId){list=S.entries.map(function(x){return x.id===curId?Object.assign({},x,data):x});}
    else{list=S.entries.concat([Object.assign({id:"e"+Date.now()},data)]);}
    commit(list,"Tersimpan ✓ Tulisan ini sekarang bisa dibaca semua orang yang punya link.");
  }
  function remove(){
    if(!canWrite||!curId||busy)return;
    if(!delArmed){delArmed=true;$("del").textContent="Yakin hapus?";return;}
    commit(S.entries.filter(function(x){return x.id!==curId}),"Tulisan dihapus.");
  }
  function legacy(){
    var a=[];
    try{var r=localStorage.getItem(KEY);if(r){var x=JSON.parse(r);if(Array.isArray(x))a=x;}}catch(e){}
    var ids={};S.entries.forEach(function(e){ids[e.id]=1});
    return a.filter(function(e){return e&&e.id&&e.text&&!ids[e.id]}).map(function(e){return {id:e.id,date:e.date||today(),mood:e.mood||"",title:e.title||"",text:e.text,updated:e.updated||0};});
  }

  $("q").oninput=render;
  render();

  (async function(){
    try{
      if(typeof claude==="undefined")return;
      var u=await claude.use("user"),a=await claude.use("artifact");
      if(a&&u&&((await u.isOwner())||(await u.canEdit()))){art=a;canWrite=true;}
    }catch(e){}
    if(!canWrite)return;
    $("sub").textContent="Hanya kamu yang bisa menulis dan mengubah di sini. Siapa pun yang punya link bisa membaca tulisan yang sudah disimpan.";
    $("editor").hidden=false;
    $("save").onclick=save;$("new").onclick=fresh;$("del").onclick=remove;
    $("text").oninput=function(){$("count").textContent=words()+" kata"};
    document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();save();}});
    fresh();
    try{var m=sessionStorage.getItem(MSG);if(m){say(m);sessionStorage.removeItem(MSG);}}catch(e){}
    var old=legacy();
    if(old.length){
      $("legacy").hidden=false;
      $("legacytxt").textContent="Ada "+old.length+" tulisan lama di browser ini yang belum masuk ke diary. Pindahkan sekarang?";
      $("legacybtn").onclick=function(){commit(S.entries.concat(old),old.length+" tulisan lama dipindahkan ✓");};
    }
    render();
  })();
})();
