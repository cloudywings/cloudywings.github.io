<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dear, izzah.</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f1e7;--card:#fffdf8;--ink:#2f2a24;--mut:#7a6f62;--line:#e4dccb;--acc:#b5543a;--accink:#fff;--sel:#f1e6d3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1915;--card:#26221c;--ink:#efe7d8;--mut:#a39785;--line:#3a342b;--acc:#d9795c;--accink:#1c1915;--sel:#322c23}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1915;--card:#26221c;--ink:#efe7d8;--mut:#a39785;--line:#3a342b;--acc:#d9795c;--accink:#1c1915;--sel:#322c23}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
main{max-width:820px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.title{flex:1 1 100%;font-size:1.1rem;font-weight:bold}
textarea{width:100%;min-height:240px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:bold}
button.d{color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.mut{color:var(--mut);font-size:.88rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.list h2{font-size:1.2rem;margin:0 0 10px}
.search{width:100%;margin-bottom:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg);cursor:pointer}
.item.on{background:var(--sel);border-color:var(--acc)}
.item b{display:block}
.item p{margin:4px 0 0;color:var(--mut);font-size:.92rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{color:var(--mut);text-align:center;padding:18px 0}
</style>
</head>
<body>
<main>
  <h1>Daily Diary</h1>
  <p class="sub">Tulis apa saja yang kamu rasakan hari ini.</p>

  <section class="card" aria-label="Editor">
    <div class="row">
      <input type="date" id="date" aria-label="Tanggal">
      <select id="mood" aria-label="Suasana hati">
        <option value="">Suasana hati</option>
        <option>😊 Senang</option><option>😌 Tenang</option><option>🥰 Bersyukur</option>
        <option>😐 Biasa saja</option><option>😴 Lelah</option><option>😟 Cemas</option><option>😢 Sedih</option><option>😠 Kesal</option>
      </select>
      <input class="title" id="title" placeholder="Judul (boleh dikosongkan)" aria-label="Judul">
    </div>
    <textarea id="text" placeholder="Hari ini aku…" aria-label="Isi diary"></textarea>
    <div class="bar">
      <span class="mut" id="count">0 kata</span>
      <div class="btns">
        <button id="new">Tulisan baru</button>
        <button class="d" id="del" hidden>Hapus</button>
        <button class="p" id="save">Simpan</button>
      </div>
    </div>
    <div class="mut" id="msg" role="status" style="margin-top:8px;min-height:1.2em"></div>
  </section>

  <section class="card list" aria-label="Daftar tulisan">
    <h2>Tulisan sebelumnya</h2>
    <input class="search" id="q" type="search" placeholder="Cari judul atau isi…" aria-label="Cari">
    <div id="list"></div>
    <div class="bar">
      <span class="mut">Cadangkan tulisanmu secara berkala.</span>
      <div class="btns">
        <button id="exp">Ekspor</button>
        <button id="imp">Impor</button>
        <input type="file" id="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  var KEY="diary:v1", entries=[], curId=null, delArmed=false, memo=null;
  var $=function(i){return document.getElementById(i)};
  var months=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

  function load(){
    try{var r=localStorage.getItem(KEY);if(r){var a=JSON.parse(r);if(Array.isArray(a))entries=a;}}
    catch(e){entries=[];}
  }
  function persist(){
    try{localStorage.setItem(KEY,JSON.stringify(entries));return true;}
    catch(e){memo=entries.slice();return false;}
  }
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function fmt(s){var p=(s||"").split("-");if(p.length!==3)return s||"";return parseInt(p[2],10)+" "+months[parseInt(p[1],10)-1]+" "+p[0];}
  function say(t){$("msg").textContent=t;}
  function words(){var t=$("text").value.trim();return t?t.split(/\s+/).length:0;}

  function fresh(){
    curId=null;delArmed=false;
    $("date").value=today();$("mood").value="";$("title").value="";$("text").value="";
    $("del").hidden=true;$("del").textContent="Hapus";
    $("count").textContent="0 kata";say("");render();
  }
  function open(id){
    var e=entries.filter(function(x){return x.id===id})[0];if(!e)return;
    curId=id;delArmed=false;
    $("date").value=e.date;$("mood").value=e.mood||"";$("title").value=e.title||"";$("text").value=e.text||"";
    $("del").hidden=false;$("del").textContent="Hapus";
    $("count").textContent=words()+" kata";say("Sedang mengedit tulisan ini.");render();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function save(){
    var text=$("text").value.trim();
    if(!text){say("Tulis sesuatu dulu ya.");return;}
    var data={date:$("date").value||today(),mood:$("mood").value,title:$("title").value.trim(),text:$("text").value,updated:Date.now()};
    if(curId){entries=entries.map(function(x){return x.id===curId?Object.assign({},x,data):x});}
    else{curId="e"+Date.now();entries.push(Object.assign({id:curId},data));}
    var ok=persist();
    $("del").hidden=false;
    say(ok?"Tersimpan ✓":"Tersimpan sementara, tapi browser menolak penyimpanan. Gunakan Ekspor untuk mencadangkan.");
    render();
  }
  function remove(){
    if(!curId)return;
    if(!delArmed){delArmed=true;$("del").textContent="Yakin hapus?";return;}
    entries=entries.filter(function(x){return x.id!==curId});persist();fresh();say("Tulisan dihapus.");
  }
  function render(){
    var q=$("q").value.trim().toLowerCase(), box=$("list");
    box.textContent="";
    var arr=entries.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.updated-a.updated;})
      .filter(function(e){return !q||((e.title||"")+" "+e.text).toLowerCase().indexOf(q)>-1;});
    if(!arr.length){var d=document.createElement("div");d.className="empty";d.textContent=entries.length?"Tidak ada yang cocok.":"Belum ada tulisan. Mulai dari yang pertama ✍️";box.appendChild(d);return;}
    arr.forEach(function(e){
      var it=document.createElement("div");it.className="item"+(e.id===curId?" on":"");
      it.tabIndex=0;it.setAttribute("role","button");
      var b=document.createElement("b");b.textContent=(e.mood?e.mood.split(" ")[0]+" ":"")+(e.title||"Tanpa judul")+" · "+fmt(e.date);
      var p=document.createElement("p");p.textContent=e.text;
      it.appendChild(b);it.appendChild(p);
      it.onclick=function(){open(e.id)};
      it.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();open(e.id);}};
      box.appendChild(it);
    });
  }
  function exportJson(){
    var blob=new Blob([JSON.stringify(entries,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="diary-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
  }
  function importJson(f){
    var r=new FileReader();
    r.onload=function(){
      try{
        var a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;
        var ids={};entries.forEach(function(e){ids[e.id]=1});
        var n=0;a.forEach(function(e){if(e&&e.id&&e.text&&!ids[e.id]){entries.push(e);n++;}});
        persist();render();say(n+" tulisan diimpor.");
      }catch(e){say("File tidak valid.");}
    };
    r.readAsText(f);
  }

  $("save").onclick=save;$("new").onclick=fresh;$("del").onclick=remove;
  $("text").oninput=function(){$("count").textContent=words()+" kata"};
  $("q").oninput=render;
  $("exp").onclick=exportJson;
  $("imp").onclick=function(){$("file").click()};
  $("file").onchange=function(){if(this.files[0])importJson(this.files[0]);this.value="";};
  document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();save();}});

  load();fresh();
})();
</script>
</body>
</html>
